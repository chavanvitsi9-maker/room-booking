<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบจองห้องประชุม</title>
    
    <!-- 1. โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
<!-- 2. โหลด Google Fonts (Sarabun) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 3. โหลด FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 4. เพิ่มใหม่: โหลด FullCalendar v6 (ไลบรารีสำหรับสร้างตารางปฏิทิน) -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	
    <!-- 5. Custom CSS สำหรับปรับแต่งหน้าตาเฉพาะจุด -->
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: #f8fafc; /* พื้นหลังสีเทาอ่อน สบายตา */
            overscroll-behavior-y: none;
        }
        
        /* จัดการ Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* ซ่อนไอคอนนาฬิกา/ปฏิทินเดิมของเบราว์เซอร์ในช่อง Input */
        input[type="time"]::-webkit-calendar-picker-indicator,
        input[type="date"]::-webkit-calendar-picker-indicator {
            background: transparent; bottom: 0; color: transparent; cursor: pointer;
            height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto;
        }
        input[type="checkbox"] { accent-color: #2563eb; }

        /* =========================================================
           การตกแต่ง FullCalendar ให้สวยงามและเข้ากับ Tailwind 
           (สามารถปรับเปลี่ยนรหัสสี Hex code ได้ตามต้องการ)
           ========================================================= */
        .fc {
            --fc-border-color: #e2e8f0;
            --fc-button-bg-color: #ffffff;
            --fc-button-border-color: #cbd5e1;
            --fc-button-text-color: #475569;
            --fc-button-hover-bg-color: #f1f5f9;
            --fc-button-hover-border-color: #94a3b8;
            --fc-button-active-bg-color: #e2e8f0;
            --fc-button-active-border-color: #94a3b8;
            --fc-today-bg-color: #eff6ff; /* สีไฮไลท์วันปัจจุบัน */
        }

        /* ปรับขนาดตัวอักษรของหัวปฏิทิน (เดือน/ปี) */
        .fc .fc-toolbar-title {
            font-size: 1.5rem !important;
            font-weight: 700;
            color: #1e293b;
        }

        /* ปรับแต่งปุ่มกดเปลี่ยนเดือน */
        .fc .fc-button {
            border-radius: 0.5rem;
            padding: 0.4rem 0.8rem;
            text-transform: capitalize;
            font-family: 'Sarabun', sans-serif;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        /* สีปุ่มเมื่อถูกคลิกใช้งาน (Active) */
        .fc .fc-button-primary:not(:disabled).fc-button-active, 
        .fc .fc-button-primary:not(:disabled):active {
            background-color: #3b82f6; 
            color: #ffffff;
            border-color: #2563eb;
        }

        /* ปรับแต่งหัวตาราง (จันทร์-อาทิตย์) */
        .fc-col-header-cell-cushion {
            padding: 12px 4px !important;
            font-weight: 600;
            color: #475569;
        }
        .fc-daygrid-day-number {
            color: #475569;
            font-weight: 500;
            padding: 8px !important;
        }

        /* ปรับแต่งการ์ดคิว (Event) ที่แสดงบนปฏิทิน */
        .fc-event {
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 0.85rem;
            border: none;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: transform 0.1s ease;
        }
        .fc-event:hover {
            transform: scale(1.02);
            cursor: pointer;
            z-index: 10;
        }

        /* การแสดงผลแบบ Responsive: บีบเมนูปฏิทินเมื่อเปิดบนจอมือถือ */
        @media (max-width: 768px) {
            .fc .fc-toolbar {
                flex-direction: column;
                gap: 12px;
            }
            .fc .fc-toolbar-title { font-size: 1.25rem !important; }
        }
    </style>
</head>
<body class="antialiased">

<!-- Container หลัก คลุมทั้งหน้าจอ -->
<div class="h-screen flex flex-col md:flex-row overflow-hidden bg-slate-50">
    
    <!-- แถบด้านซ้าย (Sidebar) สำหรับ PC / แถบด้านบน (Header) สำหรับมือถือ -->
    <aside class="w-full md:w-72 lg:w-80 bg-white shadow-sm md:shadow-none md:border-r border-slate-200 flex flex-col shrink-0 z-20">
        
        <!-- หัวเว็บ (Logo & Title) -->
        <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between md:justify-start gap-4">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shrink-0 shadow-sm">
                <i class="far fa-calendar-alt text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight">ระบบจองห้องประชุม</h1>
                <p class="text-sm text-slate-500 font-medium">📍 ห้องประชุมรันตี</p>
            </div>
            <!-- ปุ่มแฮมเบอร์เกอร์สำหรับมือถือ (ซ่อนบน PC) -->
            <button class="md:hidden text-slate-600 text-2xl w-10 h-10 flex items-center justify-center active:scale-95 transition-transform">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <!-- ปุ่มสร้างการจอง (แสดงเฉพาะในแถบ Sidebar ของ PC) -->
        <div class="p-6 hidden md:block border-b border-slate-100">
            <button onclick="openModal()" class="w-full h-12 bg-blue-600 text-white rounded-xl text-lg font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 hover:scale-[1.02] active:scale-95 transition-all flex justify-center items-center">
                <i class="fas fa-plus-circle mr-2"></i> สร้างการจองห้อง
            </button>
        </div>

<!-- แทนที่: ส่วนสถานะสีเดิม ด้วยรายการจองห้อง -->
        <div class="p-6 hidden md:flex flex-col flex-1 overflow-hidden">
            <h3 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
                <i class="fas fa-list-ul text-blue-600"></i> รายการจองห้องทั้งหมด
            </h3>
            
            <!-- พื้นที่แสดงรายการ (มี Scrollbar ซ่อนอยู่ เลื่อนได้) -->
            <div id="sidebarBookingList" class="flex-1 overflow-y-auto pr-2 pb-4 no-scrollbar">
                <p class="text-sm text-slate-500 text-center mt-10">
                    <i class="fas fa-spinner fa-spin mr-2"></i>กำลังโหลดข้อมูล...
                </p>
            </div>
        </div>
        
    </aside>

    <!-- พื้นที่หลัก (Main Content) สำหรับแสดง FullCalendar -->
<main class="flex-1 flex flex-col relative overflow-hidden pb-24 md:pb-0 bg-cover bg-center bg-no-repeat" 
          style="background-image: url('https://dual-red-tiwjauwd.edgeone.dev/file.png');">
          
        <!-- แผ่นฟิล์มสีดำจางๆ (Overlay) ปูทับรูปวิว เพื่อให้กล่องปฏิทินดูโดดเด่นลอยขึ้นมา -->
        <div class="absolute inset-0 bg-slate-900/20 z-0"></div>

        <!-- พื้นที่กล่องขาวโค้งมน -->
        <div class="h-full p-2 md:p-6 overflow-y-auto no-scrollbar w-full relative z-10">
            
            <!-- เปลี่ยนพื้นหลังกล่องปฏิทินเป็นแบบ กระจกฝ้า (bg-white/95 และ backdrop-blur-md) -->
            <div class="bg-white/50 backdrop-blur-md rounded-2xl shadow-2xl border border-white/60 p-3 md:p-6 h-full min-h-[600px] w-full relative">
                
                <!-- ตัว Container นี้สำคัญมาก: JavaScript จะใช้วาดปฏิทินที่นี่ -->
                <div id="calendar" class="h-full w-full"></div>
                
            </div>
        </div>
    </main>

    <!-- ปุ่มสร้างการจองลอยด้านล่าง (Sticky Bottom) - แสดงเฉพาะบนมือถือเท่านั้น -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-100 shadow-[0_-4px_15px_rgba(0,0,0,0.08)] z-30">
        <button onclick="openModal()" class="w-full h-14 bg-blue-600 text-white rounded-2xl text-xl font-bold shadow-lg shadow-blue-200 active:bg-blue-700 transition-colors flex justify-center items-center">
            <i class="fas fa-plus-circle mr-2"></i> สร้างการจองห้อง
        </button>
    </div>

</div>
<!-- สิ้นสุดส่วนที่ 2 (โครงสร้าง Layout) -->
<!-- ======================================================= -->
    <!-- ส่วนที่ 3: หน้าต่างยืนยันการจอง (Responsive Modal) -->
    <!-- ======================================================= -->
    
    <!-- ฉากหลังสีดำโปร่งแสง (Backdrop) -->
    <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300" onclick="closeModal()"></div>
    
    <!-- ตัวกล่อง Modal -->
    <div id="bookingModal" class="fixed z-50 bottom-0 md:bottom-auto md:top-1/2 left-0 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 right-0 md:right-auto w-full md:w-[650px] bg-white rounded-t-3xl md:rounded-2xl shadow-2xl transform translate-y-full md:translate-y-10 md:scale-95 md:opacity-0 pointer-events-none transition-all duration-300 max-h-[90vh] md:max-h-[85vh] flex flex-col">
        
        <!-- แถบลากสำหรับมือถือ (แสดงเฉพาะบนมือถือ) -->
        <div class="flex justify-center pt-4 pb-2 md:hidden cursor-pointer" onclick="closeModal()">
            <div class="w-12 h-1.5 bg-slate-300 rounded-full"></div>
        </div>

        <!-- หัวข้อ Modal และปุ่มปิดสำหรับ PC -->
        <div class="px-6 pt-4 md:pt-6 pb-4 border-b border-slate-100 flex justify-between items-center shrink-0">
            <div>
                <h2 class="text-2xl font-bold text-slate-800">ระบุข้อมูลการจอง</h2>
                <p class="text-sm text-slate-500 mt-1">กรุณากรอกข้อมูลให้ครบถ้วนเพื่อล็อกคิว</p>
            </div>
            <!-- ปุ่ม X ซ่อนบนมือถือ แสดงบน PC -->
            <button onclick="closeModal()" class="hidden md:flex w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 items-center justify-center transition-colors">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <!-- พื้นที่กรอกข้อมูล (Scroll ได้ถ้าจอมือถือเล็ก) -->
        <div class="px-6 py-6 overflow-y-auto no-scrollbar flex-1">
            <form id="bookingForm" onsubmit="submitBooking(event)">
                
                <!-- วันที่ และ เวลา (จัดเรียง 2 คอลัมน์บน PC) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                    <div class="relative">
                        <label class="block text-slate-700 text-sm font-bold mb-2" for="bookingDate">วันที่ต้องการจอง <span class="text-red-500">*</span></label>
                        <input type="date" id="bookingDate" required class="w-full min-h-[50px] text-lg px-4 border border-slate-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 bg-slate-50 relative z-10 transition-all">
                    </div>

                    <div class="flex space-x-3">
                        <div class="w-1/2 relative">
                            <label class="block text-slate-700 text-sm font-bold mb-2" for="startTime">เวลาเริ่ม <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <select id="startTime" required class="w-full min-h-[50px] text-lg px-4 appearance-none border border-slate-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 bg-slate-50 relative z-10 transition-all cursor-pointer">
                                    <option value="" disabled selected>เลือก</option>
                                    <option value="08:00">08:00</option>
                                    <option value="08:30">08:30</option>
                                    <option value="09:25">09:25</option>
                                    <option value="10:20">10:20</option>
                                    <option value="11:15">11:15</option>
                                    <option value="12:10">12:10</option>
                                    <option value="13:05">13:05</option>
                                    <option value="14:00">14:00</option>
                                    <option value="14:55">14:55</option>
                                    <option value="15:50">15:50</option>
									<option value="16:00">16:00</option>
									<option value="17:00">17:00</option>
                                </select>
                                <i class="fas fa-chevron-down absolute right-4 top-4 text-slate-400 z-20 pointer-events-none"></i>
                            </div>
                        </div>
                        <div class="w-1/2 relative">
                            <label class="block text-slate-700 text-sm font-bold mb-2" for="endTime">เวลาจบ <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <select id="endTime" required class="w-full min-h-[50px] text-lg px-4 appearance-none border border-slate-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 bg-slate-50 relative z-10 transition-all cursor-pointer">
                                    <option value="" disabled selected>เลือก</option>
                                    <option value="08:00">08:00</option>
				    <option value="08:30">08:30</option>
                                    <option value="09:25">09:25</option>
                                    <option value="10:20">10:20</option>
                                    <option value="11:15">11:15</option>
                                    <option value="12:10">12:10</option>
                                    <option value="13:05">13:05</option>
                                    <option value="14:00">14:00</option>
                                    <option value="14:55">14:55</option>
                                    <option value="15:50">15:50</option>
									<option value="16:00">16:00</option>
									<option value="17:00">17:00</option>
                                </select>
                                <i class="fas fa-chevron-down absolute right-4 top-4 text-slate-400 z-20 pointer-events-none"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <p id="timeError" class="text-red-500 text-sm mb-4 hidden bg-red-50 p-2 rounded-lg"><i class="fas fa-exclamation-circle mr-1"></i> เวลาจบต้องมากกว่าเวลาเริ่มครับ</p>

                <!-- ชื่อ และ กลุ่มสาระ (จัดเรียง 2 คอลัมน์บน PC) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                    <div>
                        <label class="block text-slate-700 text-sm font-bold mb-2" for="requesterName">ชื่อผู้ขอใช้ <span class="text-red-500">*</span></label>
                        <input type="text" id="requesterName" required placeholder="เช่น ครูสมชาย ใจดี" class="w-full min-h-[50px] text-base px-4 border border-slate-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 bg-slate-50 transition-all">
                    </div>
                    <div>
                        <label class="block text-slate-700 text-sm font-bold mb-2" for="department">กลุ่มงานหรือกลุ่มสาระฯ <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <select id="department" required class="w-full min-h-[50px] text-base px-4 appearance-none border border-slate-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 bg-slate-50 transition-all cursor-pointer">
                                <option value="" disabled selected>-- เลือกกลุ่มสาระฯ --</option>
                                <option value="วิทยาศาสตร์และเทคโนโลยี">วิทยาศาสตร์และเทคโนโลยี</option>
                                <option value="คณิตศาสตร์">คณิตศาสตร์</option>
                                <option value="ภาษาไทย">ภาษาไทย</option>
                                <option value="ภาษาต่างประเทศ">ภาษาต่างประเทศ</option>
                                <option value="สังคมศึกษาฯ">สังคมศึกษาฯ</option>
                                <option value="สุขศึกษาและพลศึกษา">สุขศึกษาและพลศึกษา</option>
                                <option value="ศิลปะ">ศิลปะ</option>
                                <option value="การงานอาชีพ">การงานอาชีพ</option>
                                <option value="กลุ่มบริหารวิชาการ">กลุ่มบริหารวิชาการ</option>
                                <option value="กลุ่มบริหารงานบุคคล">กลุ่มบริหารงานบุคคล</option>
                                <option value="กลุ่มบริหารทั่วไป">กลุ่มบริหารทั่วไป</option>
                                <option value="อื่นๆ">อื่นๆ</option>
                            </select>
                            <i class="fas fa-chevron-down absolute right-4 top-4 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-slate-700 text-sm font-bold mb-2" for="activityName">ชื่อกิจกรรม <span class="text-red-500">*</span></label>
                    <input type="text" id="activityName" required placeholder="เช่น อบรม, ประชุมหมวด" class="w-full min-h-[50px] text-base px-4 border border-slate-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 bg-slate-50 transition-all">
                </div>

                <div class="mb-2">
                    <label class="block text-slate-700 text-sm font-bold mb-3">อุปกรณ์ที่ต้องการใช้</label>
                    <!-- Checkbox เปลี่ยนเป็น 4 คอลัมน์บน PC / 2 คอลัมน์บนมือถือ -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
                        <label class="flex items-center space-x-3 bg-white border border-slate-200 p-3 rounded-xl hover:bg-blue-50 hover:border-blue-200 transition-colors cursor-pointer group">
                            <input type="checkbox" name="equipment" value="ใช้จอ" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                            <span class="text-base text-slate-700 group-hover:text-blue-700 font-medium">ใช้จอ</span>
                        </label>
                        <label class="flex items-center space-x-3 bg-white border border-slate-200 p-3 rounded-xl hover:bg-blue-50 hover:border-blue-200 transition-colors cursor-pointer group">
                            <input type="checkbox" name="equipment" value="ใช้โน๊ตบุ๊ค" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                            <span class="text-base text-slate-700 group-hover:text-blue-700 font-medium">โน๊ตบุ๊ค</span>
                        </label>
                        <label class="flex items-center space-x-3 bg-white border border-slate-200 p-3 rounded-xl hover:bg-blue-50 hover:border-blue-200 transition-colors cursor-pointer group">
                            <input type="checkbox" name="equipment" value="ใช้ไมค์" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                            <span class="text-base text-slate-700 group-hover:text-blue-700 font-medium">ใช้ไมค์</span>
                        </label>
                        <label class="flex items-center space-x-3 bg-white border border-slate-200 p-3 rounded-xl hover:bg-blue-50 hover:border-blue-200 transition-colors cursor-pointer group">
                            <input type="checkbox" name="equipment" value="ใช้ลำโพง" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                            <span class="text-base text-slate-700 group-hover:text-blue-700 font-medium">ใช้ลำโพง</span>
                        </label>
                    </div>

                    <div class="mb-5">
                        <label class="block text-slate-700 text-sm font-bold mb-2" for="fileLink">ไฟล์นำเสนอ (แนบลิงก์ Google Drive)</label>
                        <input type="url" id="fileLink" placeholder="เช่น https://drive.google.com/..." class="w-full min-h-[50px] text-base px-4 border border-slate-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 bg-slate-50 transition-all">
                    </div>
                    
                    <div class="mb-2">
                        <label class="block text-slate-700 text-sm font-bold mb-2" for="otherDetails">รายละเอียดเพิ่มเติม</label>
                        <input type="text" id="otherDetails" placeholder="ข้อความเพิ่มเติมอื่นๆ (ถ้ามี)" class="w-full min-h-[50px] text-base px-4 border border-slate-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 bg-slate-50 transition-all">
                    </div>
                </div>

                <!-- ส่วนปุ่มกด ยึดติดด้านล่างของ Modal -->
                <div class="flex gap-3 mt-8 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="w-1/3 min-h-[52px] bg-white border-2 border-slate-200 text-slate-600 text-lg font-bold rounded-xl hover:bg-slate-50 hover:text-slate-800 transition-colors">
                        ยกเลิก
                    </button>
                    <button type="submit" id="submitBtn" class="w-2/3 min-h-[52px] bg-blue-600 text-white text-lg font-bold rounded-xl shadow-lg shadow-blue-200 hover:bg-blue-700 hover:shadow-blue-300 active:scale-95 transition-all">
                        ยืนยันการจอง
                    </button>
                </div>
            </form>
        </div>
    </div>
    <!-- สิ้นสุดส่วนที่ 3 -->
<!-- ======================================================= -->
    <!-- ส่วนที่ 4: JavaScript (ฉบับสมบูรณ์ แก้ไขข้อผิดพลาดแล้ว) -->
    <!-- ======================================================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        // 1. ตั้งค่าการเชื่อมต่อ Firebase 
        const firebaseConfig = {
            databaseURL: "https://room-runty-booking-system-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- ระบบตัวแปรกลาง ---
        let calendar; 

        // --- ระบบจัดการ Modal ---
        const modal = document.getElementById('bookingModal');
        const backdrop = document.getElementById('modalBackdrop');
        const bookingDateInput = document.getElementById('bookingDate');
        const startTimeInput = document.getElementById('startTime');
        const endTimeInput = document.getElementById('endTime');
        const timeError = document.getElementById('timeError');
        const submitBtn = document.getElementById('submitBtn');

        // ฟังก์ชันเปิด Modal พร้อมล็อกวันที่หากคลิกจากปฏิทิน
window.openModal = function(prefillDate = null) {
            backdrop.classList.remove('hidden');
            setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
            
            // 🌟 แก้ไข: ลบ pointer-events-none ออก เพื่อให้ฟอร์มกลับมากดได้
            modal.classList.remove('translate-y-full', 'md:translate-y-10', 'md:scale-95', 'md:opacity-0', 'pointer-events-none');

            if (prefillDate && typeof prefillDate === 'string') {
                bookingDateInput.value = prefillDate;
            } else {
                const today = new Date();
                const localDate = new Date(today.getTime() - (today.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                bookingDateInput.value = localDate;
            }
        };

        // ฟังก์ชันปิด Modal
        window.closeModal = function() {
            // 🌟 แก้ไข: เติม pointer-events-none กลับเข้าไป เพื่อให้ฟอร์มทะลุเมาส์ได้ตอนล่องหน
            modal.classList.add('translate-y-full', 'md:translate-y-10', 'md:scale-95', 'md:opacity-0', 'pointer-events-none');
            backdrop.classList.add('opacity-0');
            setTimeout(() => backdrop.classList.add('hidden'), 300);
            
            document.getElementById('bookingForm').reset();
            timeError.classList.add('hidden');

            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            submitBtn.innerHTML = "ยืนยันการจอง";
        };
        // --- ตรวจสอบความถูกต้องของเวลา ---
        function checkTimeValidity() {
            if (startTimeInput.value && endTimeInput.value) {
                if (startTimeInput.value >= endTimeInput.value) {
                    timeError.classList.remove('hidden');
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    timeError.classList.add('hidden');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }
        }
        startTimeInput.addEventListener('change', checkTimeValidity);
        endTimeInput.addEventListener('change', checkTimeValidity);

// --- สร้างและตั้งค่าปฏิทิน FullCalendar ---
        const calendarEl = document.getElementById('calendar');
        
        // ตรวจสอบขนาดหน้าจอ
        const isMobile = window.innerWidth < 768;

        calendar = new FullCalendar.Calendar(calendarEl, {
            locale: 'th', 
            initialView: isMobile ? 'listMonth' : 'dayGridMonth', 
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: isMobile ? 'listMonth,dayGridMonth' : 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            buttonText: {
                today: 'วันนี้', month: 'เดือน', week: 'สัปดาห์', day: 'วัน', list: 'รายการ'
            },
            height: '100%',
            themeSystem: 'standard',
            events: [], 

            // เปลี่ยนหน้าตาอัตโนมัติเมื่อหมุนหน้าจอ
            windowResize: function(arg) {
                const isMobileNow = window.innerWidth < 768;
                calendar.changeView(isMobileNow ? 'listMonth' : 'dayGridMonth');
                calendar.setOption('headerToolbar', {
                    left: 'prev,next today',
                    center: 'title',
                    right: isMobileNow ? 'listMonth,dayGridMonth' : 'dayGridMonth,timeGridWeek,timeGridDay'
                });
            },
            
            // ❌ เอาฟังก์ชัน dateClick และ select ออกไปแล้ว ผู้ใช้จะกดที่วันที่ว่างไม่ได้
            
            // ✅ คงไว้แค่ eventClick: กดดูรายละเอียดคิวสีแดงที่ถูกจองไปแล้วได้ปกติ
            eventClick: function(info) {
                const startText = info.event.start.toLocaleTimeString('th-TH', {hour: '2-digit', minute: '2-digit'});
                const endText = info.event.end ? info.event.end.toLocaleTimeString('th-TH', {hour: '2-digit', minute: '2-digit'}) : '';
                alert(`📌 ${info.event.title}\n⏰ เวลา: ${startText} - ${endText}`);
            }
        });
        
        // สั่งวาดปฏิทิน
        calendar.render();

        // ฟังเสียงอัปเดตจาก Firebase แบบ Real-time
const bookingsRef = ref(db, 'bookings');
        onValue(bookingsRef, (snapshot) => {
            const data = snapshot.val();
            let eventsArray = [];

            if (data) {
                for (let key in data) {
                    const booking = data[key];
                    eventsArray.push({
                        id: booking.id,
                        title: booking.title || 'จองแล้ว',
                        start: booking.start,
                        end: booking.end,
                        color: '#ef4444', 
                        textColor: '#ffffff'
                    });
                }
            }
            
            // 1. อัปเดตตารางปฏิทินหลัก (ส่วนขวา)
            calendar.removeAllEventSources();
            calendar.addEventSource(eventsArray);

            // 2. สร้างรายการจองในแถบเมนู (ส่วนซ้าย) ให้หน้าตาเหมือนมือถือ
            const sidebarList = document.getElementById('sidebarBookingList');
            if (sidebarList) {
                if (eventsArray.length === 0) {
                    sidebarList.innerHTML = '<p class="text-sm text-slate-500 text-center mt-10">ยังไม่มีรายการจอง</p>';
                } else {
                    // เรียงลำดับคิวจากวันที่เก่าสุด ไป ใหม่สุด
                    eventsArray.sort((a, b) => new Date(a.start) - new Date(b.start));
                    
                    let htmlContent = '';
                    let lastDateKey = ''; // ตัวแปรเก็บวันที่เพื่อใช้จัดกลุ่ม

                    eventsArray.forEach(event => {
                        const startDate = new Date(event.start);
                        const endDate = event.end ? new Date(event.end) : startDate;
                        
                        // แปลงวันที่เป็นข้อความ เช่น "14 สิงหาคม 2569" และ "วันศุกร์"
                        const dateStr = startDate.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
                        const dayStr = startDate.toLocaleDateString('th-TH', { weekday: 'long' });
                        
                        // หากเป็นวันที่ใหม่ ให้สร้างหัวข้อขั้น (เหมือนในมือถือ)
                        if (dateStr !== lastDateKey) {
                            htmlContent += `
                                <div class="mt-4 mb-2 flex justify-between items-end border-b border-slate-200 pb-1">
                                    <span class="font-bold text-slate-800 text-xs">${dateStr}</span>
                                    <span class="text-xs text-slate-500 font-medium">${dayStr}</span>
                                </div>
                            `;
                            lastDateKey = dateStr;
                        }

                        // จัดรูปแบบเวลา เช่น "08:10 - 09:00"
                        const startTime = startDate.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
                        const endTime = endDate.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

                        // สร้างการ์ดรายการ (กดคลิกเพื่อดูรายละเอียดได้ด้วย)
                        htmlContent += `
                            <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm hover:border-blue-300 hover:shadow-md transition-all mb-2 cursor-pointer group" onclick="alert('📌 ${event.title}\\n📅 วันที่: ${dateStr}\\n⏰ เวลา: ${startTime} - ${endTime}')">
                                <div class="flex items-start gap-2">
                                    <div class="w-2 h-2 mt-1.5 rounded-full bg-red-500 shrink-0 group-hover:scale-125 transition-transform"></div>
                                    <div class="flex-1 overflow-hidden">
                                        <p class="text-xs font-bold text-slate-700">${startTime} - ${endTime}</p>
                                        <p class="text-xs text-slate-600 truncate mt-0.5">${event.title}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    
                    // นำโค้ดที่สร้างเสร็จแล้วไปแสดงหน้าเว็บ
                    sidebarList.innerHTML = htmlContent;
                }
            }
        });

        // --- ฟังก์ชันกดยืนยันการจอง ---
        window.submitBooking = function(event) {
            event.preventDefault(); 
            
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> กำลังดำเนินการ...';
            submitBtn.classList.remove("bg-blue-600", "hover:bg-blue-700", "shadow-blue-200");
            submitBtn.classList.add("bg-slate-400", "cursor-not-allowed");
            submitBtn.disabled = true;

            let selectedEquipment = [];
            document.querySelectorAll('input[name="equipment"]:checked').forEach(cb => selectedEquipment.push(cb.value));
            
            const payload = {
                room: "ห้องประชุมรันตี",
                bookingDate: document.getElementById('bookingDate').value, 
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                requesterName: document.getElementById('requesterName').value,
                department: document.getElementById('department').value,
                activityName: document.getElementById('activityName').value,
                equipment: selectedEquipment.join(', ') || "ไม่ได้ใช้อุปกรณ์",
                fileLink: document.getElementById('fileLink').value || "-",
                otherDetails: document.getElementById('otherDetails').value || "-"
            };

            const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxrKIwlliRzwDrE1moSu8ngFQNpb6i9a4iE1AcamKCKH5Ke50c19QQz9bD9ktGjYQ054Q/exec"; 
            
            fetch(WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({ body: payload }), 
              redirect: "follow" 
            })
            .then(response => response.json())
.then(result => {
                if(result.status === "success") {
                    // Popup จองสำเร็จ (ไอคอนสีเขียว)
                    Swal.fire({
                        title: 'จองห้องสำเร็จ!',
                        text: 'ระบบได้บันทึกคิวของคุณเรียบร้อยแล้ว',
                        icon: 'success',
                        confirmButtonText: 'ตกลง',
                        confirmButtonColor: '#2563eb',
                        customClass: {
                            popup: 'rounded-2xl',
                            title: 'font-Sarabun text-xl font-bold text-slate-800'
                        }
                    }).then(() => {
                        const form = document.getElementById("bookingForm");
                        if (form) form.reset();
                        closeModal();
                    });
                } else {
                    // Popup คิวซ้ำ / จองไม่สำเร็จ (ไอคอนสีแดง)
                    Swal.fire({
                        title: 'ไม่สามารถจองได้',
                        text: result.message,
                        icon: 'error',
                        confirmButtonText: 'เลือกเวลาใหม่',
                        confirmButtonColor: '#ef4444',
                        customClass: {
                            popup: 'rounded-2xl border-2 border-red-100',
                            title: 'font-Sarabun text-xl font-bold text-red-600'
                        }
                    });
                }
            })
            .catch(error => {
                console.error("Error:", error);
                Swal.fire({
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง',
                    icon: 'warning',
                    confirmButtonText: 'ตกลง',
                    confirmButtonColor: '#f59e0b'
                });
            })
            .finally(() => {
                submitBtn.innerHTML = "ยืนยันการจอง";
                submitBtn.classList.remove("bg-slate-400", "cursor-not-allowed");
                submitBtn.classList.add("bg-blue-600", "hover:bg-blue-700", "shadow-blue-200");
                submitBtn.disabled = false;
            });
        };
    </script>
</body>
</html>
